<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consultor de Branding — Site (5 direções)</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="variations.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #e7e5e0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="v1-editorial.jsx"></script>
<script type="text/babel" src="v2-silence.jsx"></script>
<script type="text/babel" src="v3-index.jsx"></script>
<script type="text/babel" src="v4-letter.jsx"></script>
<script type="text/babel" src="v5-quiet-grid.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas
      title="Consultor de Branding"
      subtitle="5 direções para a homepage — monocromático, editorial, bilíngue."
    >
      <DCSection
        id="homes"
        title="Homepage — direções"
        subtitle="Cada artboard é uma interpretação distinta da mesma marca. Clique para entrar em foco."
      >
        <DCArtboard id="v1" label="01 · Editorial Manifesto" width={1440} height={900}>
          <V1Editorial />
        </DCArtboard>
        <DCArtboard id="v2" label="02 · Apple Silence (dark)" width={1440} height={900}>
          <V2Silence />
        </DCArtboard>
        <DCArtboard id="v3" label="03 · Index (catálogo tipográfico)" width={1440} height={1000}>
          <V3Index />
        </DCArtboard>
        <DCArtboard id="v4" label="04 · Carta aberta" width={1440} height={1000}>
          <V4Letter />
        </DCArtboard>
        <DCArtboard id="v5" label="05 · Quiet Grid (assimétrico)" width={1440} height={1000}>
          <V5QuietGrid />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
